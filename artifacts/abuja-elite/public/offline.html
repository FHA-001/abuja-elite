<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abuja Elite is offline</title>
<style>
  :root { color-scheme: dark; }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; padding: 24px; background: #0f0c08; color: #f3ebdc; font-family: Georgia, 'Times New Roman', serif; text-align: center; }
  main { max-width: 440px; }
  img { width: 140px; height: 140px; border-radius: 28px; margin-bottom: 28px; }
  h1 { margin: 0 0 14px; font-size: 2.4rem; font-weight: 500; letter-spacing: -0.02em; line-height: 1.05; }
  p { margin: 0 0 28px; color: #c8bead; font: 1.02rem/1.7 system-ui, -apple-system, 'Segoe UI', sans-serif; }
  button { padding: 14px 28px; border: 0; border-radius: 999px; background: linear-gradient(135deg, #f1d38f, #c99a3f); color: #1a1208; font: 700 0.9rem system-ui, sans-serif; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icon-192.png" alt="Abuja Elite">
  <h1>You are offline.</h1>
  <p>Abuja Elite needs a connection to show your account, events and community. Check your signal and try again.</p>
  <button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
